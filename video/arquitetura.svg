<text x="440" y="162" text-anchor="middle" font-size="12" fill="#993C1D">alvo · porta 3000</text>

<rect x="266" y="190" width="348" height="58" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="440" y="217" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Ollama + Qwen3 4B</text>
<text x="440" y="236" text-anchor="middle" font-size="12" fill="#534AB7">LLM local · porta 11434</text>

